# Identité « autonome » pour l'outil : un ServiceAccount + ses droits RBAC. Le jeton est
# fabriqué à la demande (TokenRequest borné dans le temps, cf. make-kubeconfig.sh) et
# transformé en kubeconfig SANS exec-plugin.
#
# Prérequis : le namespace `hycu` doit exister (kubectl create namespace hycu).
#
# Moindre privilège : les règles ci-dessous correspondent EXACTEMENT aux appels kubectl
# de l'outil (lecture des manifestes pour la sauvegarde étendue, séquence de restauration,
# clone d'application, pré-vol). Les Secrets ne sont lus qu'au niveau NAMESPACE : un
# RoleBinding par namespace applicatif (voir le bloc « hycu-app-secrets » en bas),
# jamais cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hycu-operator
  namespace: hycu
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hycu-operator
rules:
  # --- Séquence de restauration (PV cluster-scoped, PVC, pods, VolumeAttachment) ---
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list"]                       # vérification : raison des pods bloqués (FailedMount…)
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments", "storageclasses"]
    verbs: ["get", "list"]                       # pré-vol : détachement confirmé, StorageClass présente
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]             # clone cross-namespace : création du ns cible
  # --- Workloads : lecture (sauvegarde étendue), scale (restauration), création (clone) ---
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  # --- Dépendances clonées (ConfigMaps, ServiceAccounts, Services) ---
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts", "services"]
    verbs: ["get", "list", "create", "patch"]    # restauration d'objets : kubectl apply sur l'existant
  # --- Sauvegarde de configuration ÉTENDUE : lecture seule des kinds exportés ---
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]   # NAS copy: short flatten Job in the target namespace
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]                               # output of that Job
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  # --- Pré-vol : vérification des droits (kubectl auth can-i) ---
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hycu-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hycu-operator
subjects:
  - kind: ServiceAccount
    name: hycu-operator
    namespace: hycu
---
# Secrets : lecture + création LIMITÉES aux namespaces applicatifs protégés. Dupliquez
# le RoleBinding ci-dessous pour chaque namespace de `namespace_filter` (remplacez
# `wordpress`). Sans ce binding, la sauvegarde étendue signale les Secrets comme
# « non exportés » (resources_skipped) et le clone cross-namespace ne copie pas les Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hycu-app-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hycu-app-secrets
  namespace: wordpress                # <- un RoleBinding par namespace applicatif
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hycu-app-secrets
subjects:
  - kind: ServiceAccount
    name: hycu-operator
    namespace: hycu
