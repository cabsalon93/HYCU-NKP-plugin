name: build-image

# 1) Tests + lint + vérification du build de l'interface, sur chaque push / PR.
# 2) Image (multi-arch) poussée sur ghcr.io :
#  - push / merge dans `main`            -> :main et :latest (latest = branche par défaut UNIQUEMENT)
#  - tag `vX.Y.Z`                        -> :vX.Y.Z (+ tarball air-gap), jamais :latest
#  - « Run workflow » (workflow_dispatch) -> :<branche> seulement (ne peut PAS écraser :latest)
# 3) Scan de vulnérabilités (Trivy) bloquant sur CRITICAL/HIGH, signature cosign (keyless).
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write          # signature cosign keyless (OIDC)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint (ruff, erreurs uniquement)
        run: |
          pip install ruff pytest
          ruff check --select E9,F63,F7,F82 hycu_k8s_nutanix.py build.py tests
      - name: Le fichier livré est bien la sortie du build de l'interface
        run: python build.py --check
      - name: Tests
        run: python -m pytest -q tests

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags)
        id: meta
        run: |
          echo "img=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          ref="${GITHUB_REF_NAME:-manual}"
          ref="${ref//\//-}"   # un ref de branche peut contenir « / », interdit dans un tag Docker
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          # Image VERSIONNÉE : la version du programme (VERSION = "AAAAMMJJ-HHMM" dans le
          # code) devient aussi un tag d'image « vAAAAMMJJ-HHMM » — chaque build est
          # épinglable et le retour arrière est une simple commande kubectl.
          ver=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' hycu_k8s_nutanix.py | head -1)
          echo "appver=v${ver:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Build & push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.img }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.img }}:${{ steps.meta.outputs.appver }}
            ${{ steps.meta.outputs.img }}:latest
          sbom: true
          provenance: mode=max

      # Porte BLOQUANTE : paquets du système de base (Debian) et dépendances Python.
      # Le binaire kubectl (Go statique, livré par le projet Kubernetes) est scanné à
      # part, sans bloquer : ses CVE sont celles de la bibliothèque standard Go au
      # moment de sa compilation, corrigées uniquement par la prochaine version amont
      # (KUBECTL_VERSION dans deploy/Dockerfile — à suivre à chaque mise à jour).
      - name: Scan de vulnérabilités (Trivy) — système de base (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.img }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          severity: CRITICAL,HIGH

      - name: Scan de vulnérabilités (Trivy) — binaires embarqués (kubectl, informatif)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.img }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: library
          severity: CRITICAL,HIGH
          skip-setup-trivy: true

      - uses: sigstore/cosign-installer@v3
      - name: Signature de l'image (cosign keyless)
        run: cosign sign --yes ${{ steps.meta.outputs.img }}@${{ steps.build.outputs.digest }}

      - name: Tarball air-gap (amd64, tags vX.Y.Z uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker buildx build --platform linux/amd64 --file deploy/Dockerfile \
            --tag hycu-nkp:${{ github.ref_name }} --load .
          docker save hycu-nkp:${{ github.ref_name }} \
            | gzip > hycu-nkp-${{ github.ref_name }}-amd64.tar.gz

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: hycu-nkp-image-tarball
          path: hycu-nkp-*.tar.gz
          retention-days: 30
